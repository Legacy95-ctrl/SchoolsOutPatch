; Rec Room 2026 patch configuration for client 2026-03-31T03-05-36Z_473be467 only.
; Keep this file beside 2026patch.dll. Edit settings before launching the game.
; Changes take effect on the next launch. No server address or key is included.
; Lines starting with a semicolon are notes. Keep each setting on one line.

[config]

; Backend host. Bare host name -- no scheme, no path. Example: ns.example.com
; ApiHost rewrites ns.rec.net in discovery requests and the RecNet name-server
; getter. A port (localhost:8080) or full origin (http://localhost:8080) is
; accepted; a bare host keeps the request's own scheme. No trailing slash,
; path or query. EMPTY = leave the client's discovery origin unchanged.
ApiHost=

; Optional domain used to scope the SSL pinning bypass. Example: example.com
; When set, ApiHost must be this domain or a subdomain. The bypass applies to
; this domain and its subdomains. When blank, the host from ApiHost is used.
ServerDomain=

; true = enable the SSL pinning patch for the configured service domain.
; This skips the legacy certificate pin check for that domain only.
; false = keep the client's original certificate policy. Default: true.
EnableSslPinning=true

; true = accept images not signed by the retired official image service.
; This applies to all images checked by the patch because the native verifier
; receives bytes, not a URL. false = keep original checks. Default: true.
AllowUnsignedImages=true

; Force the device-id (DUID) mismatch check to false. Works around the launch /
; Create Account hang on a machine with a corrupt stored device id.
; Default: true. Same setting name as in 2025patch.ini.
SuppressDuidMismatch=true

; false = startup, connection state and failures only (default).
; true = extra hook diagnostics. Log: 2026patch.log beside the DLL.
; HTTP paths, queries, headers, device IDs and key contents are not logged.
EnableTracing=false

; Voice (Tachyon) RSA PUBLIC key, .NET <RSAKeyValue> XML on ONE line.
; Format: <RSAKeyValue><Modulus>BASE64_MODULUS</Modulus><Exponent>AQAB</Exponent></RSAKeyValue>
; Obtain the public key from your server operator. Only Modulus and Exponent
; are allowed; private RSA fields are rejected. EMPTY = keep the client key.
; The room/voice endpoint always comes from matchmaking.
VoiceKeyXml=
